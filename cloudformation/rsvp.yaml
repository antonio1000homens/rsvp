AWSTemplateFormatVersion: '2010-09-09'
Description: RSVP application origin (private site bucket, DynamoDB table, Lambda, and Function URL)

Parameters:
  CodeBucket:
    Type: String
    Default: aws2022-lambda-code
    Description: Existing bucket containing versioned Lambda artifacts.
  FunctionCodeKey:
    Type: String
    Description: S3 key for the RSVP Lambda ZIP.
  SiteBucketName:
    Type: String
  TableName:
    Type: String
    Default: rsvp
  FunctionName:
    Type: String
    Default: rsvp-app
  PhoneProcessorFunctionName:
    Type: String
    Default: rsvp-phone-processor
  OriginSecretParameter:
    Type: String
    Default: /rsvp/origin-secret
  SessionSecretParameter:
    Type: String
    Default: /rsvp/session-secret
  WhatsappNumberParameter:
    Type: String
    Default: /rsvp/whatsapp-number
  PhoneWebhookSecretParameter:
    Type: String
    Default: /rsvp/phone-webhook-secret
  ValidationSecretParameter:
    Type: String
    Default: /rsvp/validation-secret
  TurnstileSiteKeyParameter:
    Type: String
    Default: /rsvp/turnstile-site-key
  TurnstileSecretParameter:
    Type: String
    Default: /rsvp/turnstile-secret
  WebauthnRpId:
    Type: String
    Default: calcada2026.pt
  WebauthnExpectedOrigin:
    Type: String
    Default: https://calcada2026.pt
  AvailabilityDays:
    Type: CommaDelimitedList
    Default: 19 December 2026,20 December 2026,21 December 2026,22 December 2026,23 December 2026
    Description: Exactly five labels for the RSVP availability window.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref SiteBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Application
          Value: rsvp
        - Key: ManagedBy
          Value: CloudFormation

  RsvpTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Application
          Value: rsvp
        - Key: ManagedBy
          Value: CloudFormation

  RsvpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FunctionName}
      RetentionInDays: 7
      Tags:
        - Key: Application
          Value: rsvp

  PhoneRegistrationDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: rsvp-phone-registration-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  PhoneRegistrationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: rsvp-phone-registration
      SqsManagedSseEnabled: true
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PhoneRegistrationDlq.Arn
        maxReceiveCount: 5

  PhoneRegistrationDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: rsvp-phone-registration-dlq-not-empty
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PhoneRegistrationDlq.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RsvpFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RsvpApplicationAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadSiteBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub ${SiteBucket.Arn}/*
              - Sid: ListSiteBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Sid: UseRsvpTable
                Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:TransactWriteItems
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt RsvpTable.Arn
              - Sid: ReadRsvpSecrets
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OriginSecretParameter}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SessionSecretParameter}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WhatsappNumberParameter}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PhoneWebhookSecretParameter}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ValidationSecretParameter}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TurnstileSiteKeyParameter}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TurnstileSecretParameter}
              - Sid: EnqueuePhoneRegistrations
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt PhoneRegistrationQueue.Arn
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt RsvpLogGroup.Arn

  RsvpFunction:
    Type: AWS::Lambda::Function
    DependsOn: RsvpLogGroup
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Handler: index.handler
      Role: !GetAtt RsvpFunctionRole.Arn
      Timeout: 15
      MemorySize: 256
      ReservedConcurrentExecutions: 5
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref FunctionCodeKey
      Environment:
        Variables:
          SITE_BUCKET: !Ref SiteBucket
          RSVP_TABLE: !Ref RsvpTable
          ORIGIN_SECRET_PARAMETER: !Ref OriginSecretParameter
          SESSION_SECRET_PARAMETER: !Ref SessionSecretParameter
          WHATSAPP_NUMBER_PARAMETER: !Ref WhatsappNumberParameter
          PHONE_WEBHOOK_SECRET_PARAMETER: !Ref PhoneWebhookSecretParameter
          VALIDATION_SECRET_PARAMETER: !Ref ValidationSecretParameter
          TURNSTILE_SITE_KEY_PARAMETER: !Ref TurnstileSiteKeyParameter
          TURNSTILE_SECRET_PARAMETER: !Ref TurnstileSecretParameter
          WEBAUTHN_RP_ID: !Ref WebauthnRpId
          WEBAUTHN_EXPECTED_ORIGIN: !Ref WebauthnExpectedOrigin
          WEBAUTHN_RP_NAME: Calçada 2026 RSVP
          RSVP_DAYS: !Join [',', !Ref AvailabilityDays]
          PHONE_QUEUE_URL: !Ref PhoneRegistrationQueue
      Tags:
        - Key: Application
          Value: rsvp
        - Key: ManagedBy
          Value: CloudFormation

  PhoneProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PhoneProcessorFunctionName}
      RetentionInDays: 7

  PhoneProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProcessPhoneRegistrations
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !GetAtt PhoneRegistrationQueue.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:TransactWriteItems, dynamodb:UpdateItem]
                Resource: !GetAtt RsvpTable.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ValidationSecretParameter}
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt PhoneProcessorLogGroup.Arn

  PhoneProcessorFunction:
    Type: AWS::Lambda::Function
    DependsOn: PhoneProcessorLogGroup
    Properties:
      FunctionName: !Ref PhoneProcessorFunctionName
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: phone-worker.handler
      Role: !GetAtt PhoneProcessorRole.Arn
      Timeout: 15
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref FunctionCodeKey
      Environment:
        Variables:
          RSVP_TABLE: !Ref RsvpTable
          VALIDATION_SECRET_PARAMETER: !Ref ValidationSecretParameter

  PhoneProcessorEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt PhoneRegistrationQueue.Arn
      FunctionName: !Ref PhoneProcessorFunction
      BatchSize: 1

  RsvpFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref RsvpFunction
      AuthType: NONE
      InvokeMode: BUFFERED

  RsvpFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RsvpFunction
      Principal: '*'
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: NONE

  RsvpFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RsvpFunction
      Principal: '*'
      Action: lambda:InvokeFunction
      InvokedViaFunctionUrl: true

Outputs:
  SiteBucketName:
    Description: Private bucket holding the built website.
    Value: !Ref SiteBucket
  SiteBucketArn:
    Value: !GetAtt SiteBucket.Arn
  TableName:
    Value: !Ref RsvpTable
  TableArn:
    Value: !GetAtt RsvpTable.Arn
  FunctionName:
    Value: !Ref RsvpFunction
  FunctionArn:
    Value: !GetAtt RsvpFunction.Arn
  FunctionUrl:
    Value: !GetAtt RsvpFunctionUrl.FunctionUrl
  FunctionRoleArn:
    Value: !GetAtt RsvpFunctionRole.Arn
  PhoneRegistrationQueueUrl:
    Value: !Ref PhoneRegistrationQueue
  PhoneProcessorFunctionArn:
    Value: !GetAtt PhoneProcessorFunction.Arn
