AWSTemplateFormatVersion: '2010-09-09'
Description: Dedicated GitHub OIDC and CloudFormation service roles for the RSVP repository

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Default: arn:aws:iam::243857182133:oidc-provider/token.actions.githubusercontent.com
  GitHubRepository:
    Type: String
    Default: antonio1000homens/rsvp
  GitHubEnvironment:
    Type: String
    Default: production
  GitHubBranch:
    Type: String
    Default: master
  ApplicationStackName:
    Type: String
    Default: rsvp
  CodeBucket:
    Type: String
    Default: aws2022-lambda-code
  SiteBucketName:
    Type: String
    Default: rsvp-243857182133-eu-west-2-site
  TableName:
    Type: String
    Default: rsvp
  FunctionName:
    Type: String
    Default: rsvp-app

Resources:
  CloudFormationServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: RsvpCloudFormationServiceRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ManageRsvpResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadLambdaArtifact
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub arn:${AWS::Partition}:s3:::${CodeBucket}/rsvp/*
              - Sid: ManageSiteBucket
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:DeleteBucketPolicy
                  - s3:GetEncryptionConfiguration
                  - s3:GetBucketLocation
                  - s3:GetBucketOwnershipControls
                  - s3:GetBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetLifecycleConfiguration
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutLifecycleConfiguration
                  - s3:PutBucketTagging
                  - s3:GetBucketTagging
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${SiteBucketName}
                  - !Sub arn:${AWS::Partition}:s3:::${SiteBucketName}/*
              - Sid: ManageRsvpTable
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:ListTagsOfResource
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:UpdateTable
                  - dynamodb:UpdateTimeToLive
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
              - Sid: ManageRsvpLambda
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:CreateFunctionUrlConfig
                  - lambda:DeleteFunction
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:DeleteFunctionConcurrency
                  - lambda:GetFunction
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetFunctionUrlConfig
                  - lambda:GetPolicy
                  - lambda:ListTags
                  - lambda:PutFunctionConcurrency
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:UpdateFunctionUrlConfig
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}
              - Sid: ManageRsvpLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DeleteRetentionPolicy
                  - logs:ListTagsForResource
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}:*
              - Sid: DiscoverRsvpLogGroup
                Effect: Allow
                Action:
                  - logs:DescribeIndexPolicies
                  - logs:DescribeLogGroups
                Resource: '*'
              - Sid: ManageRsvpExecutionRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/rsvp-*

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActionsRsvpDeployRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepository}:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubRepository}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: DeployRsvpStack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UploadLambdaArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${CodeBucket}/rsvp/*
              - Sid: ListArtifactPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${CodeBucket}
                Condition:
                  StringLike:
                    s3:prefix: rsvp/*
              - Sid: PublishWebsite
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucketName}/*
              - Sid: InspectWebsiteBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetBucketPublicAccessBlock
                  - s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucketName}
              - Sid: DeployApplicationStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:UpdateStack
                  - cloudformation:UpdateTerminationProtection
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationStackName}/*
              - Sid: ValidateTemplates
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: PassCloudFormationServiceRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationServiceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: VerifyApplicationResources
                Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - lambda:GetFunction
                  - lambda:GetFunctionConcurrency
                  - lambda:GetFunctionUrlConfig
                  - logs:DescribeLogGroups
                Resource: '*'

Outputs:
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationServiceRoleArn:
    Value: !GetAtt CloudFormationServiceRole.Arn
